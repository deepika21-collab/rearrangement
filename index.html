<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimagining Shopping with AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #20243a;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-size: 23px;
    }

    header button {
      background: #ffbd59;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 45px 15px;
      background: linear-gradient(120deg, #e8eaff, #fff0e2);
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #555;
    }

    .controls {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    #search {
      flex: 1;
      min-width: 200px;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 10px 15px 35px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
      transition: transform 0.2s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 16px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      color: #20243a;
      margin-bottom: 12px;
    }

    .add-btn, .cart-btn {
      background: #20243a;
      color: white;
      border: none;
      padding: 11px;
      width: 100%;
      border-radius: 7px;
      cursor: pointer;
    }

    .add-btn:hover, .cart-btn:hover {
      background: #414b79;
    }

    #cartSection {
      max-width: 900px;
      margin: 25px auto;
      padding: 25px 15px;
      background: white;
      border-radius: 12px;
      display: none;
    }

    #cartSection h2 {
      margin-bottom: 18px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
      flex-wrap: wrap;
    }

    .quantity button, .remove-btn {
      padding: 7px 11px;
      margin: 3px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .quantity button {
      background: #e8eaff;
    }

    .remove-btn {
      background: #ffe1e1;
      color: #a00;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      margin-top: 20px;
    }

    .empty {
      color: #777;
      padding: 15px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #20243a;
      color: white;
      margin-top: 30px;
    }

    @media(max-width: 600px) {
      header {
        padding: 18px;
      }
      .hero h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>ShopSmart AI</h1>
    <button onclick="showCart()">
      View Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Reimagining Shopping with AI</h2>
    <p>Discover products and enjoy a smarter shopping experience!</p>
  </section>

  <section class="controls">
    <input
      type="text"
      id="search"
      placeholder="Search products..."
      oninput="displayProducts()"
    >

    <select id="category" onchange="displayProducts()">
      <option value="All">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Fashion">Fashion</option>
      <option value="Accessories">Accessories</option>
      <option value="Lifestyle">Lifestyle</option>
    </select>
  </section>

  <h2 style="text-align:center; margin:15px;">Our Products</h2>

  <section class="products" id="productList"></section>

  <section id="cartSection">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <div class="total" id="cartTotal">Total: ₹0</div>
    <button class="cart-btn" onclick="clearCart()" style="margin-top:15px;">
      Clear Cart
    </button>
  </section>

  <footer>
    <p>ShopSmart AI | Smart Shopping Experience</p>
    <p>Hackathon Project</p>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        name: "Laptop",
        category: "Electronics",
        price: 45000,
        image: image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: 2,
        name: "Smartphone",
        category: "Electronics",
        price: 18000,
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"
      },
      {
        id: 3,
        name: "Headphones",
        category: "Electronics",
        price: 2500,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
      },
      {
        id: 4,
        name: "Smartwatch",
        category: "Electronics",
        price: 3500,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"
      },
      {
        id: 5,
        name: "Camera",
        category: "Electronics",
        price: 32000,
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600"
      },
      {
        id: 6,
        name: "Bluetooth Speaker",
        category: "Electronics",
        price: 1800,
        image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=600"
      },
      {
        id: 7,
        name: "Sneakers",
        category: "Fashion",
        price: 2200,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
      },
      {
        id: 8,
        name: "T-Shirt",
        category: "Fashion",
        price: 700,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"
      },
      {
        id: 9,
        name: "Handbag",
        category: "Fashion",
        price: 1500,
        image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600"
      },
      {
        id: 10,
        name: "Sunglasses",
        category: "Accessories",
        price: 900,
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600"
      },
      {
        id: 11,
        name: "Tablet",
        category: "Electronics",
        price: 15000,
        image: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=600"
      },
      {
        id: 12,
        name: "Skincare Kit",
        category: "Lifestyle",
        price: 1200,
        image: "https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=600"
      }
    ];

    let cart = {};

    function displayProducts() {
      const search = document.getElementById("search").value.toLowerCase();
      const category = document.getElementById("category").value;

      const filtered = products.filter(product => {
        const matchesSearch =
          product.name.toLowerCase().includes(search);

        const matchesCategory =
          category === "All" || product.category === category;

        return matchesSearch && matchesCategory;
      });

      const list = document.getElementById("productList");

      if (filtered.length === 0) {
        list.innerHTML = "<p>No products found.</p>";
        return;
      }

      list.innerHTML = filtered.map(product => `
        <div class="product">
          <img
            src="${product.image}"
            alt="${product.name}"
            onerror="this.style.display='none'"
          >
          <div class="product-info">
            <h3>${product.name}</h3>
            <p class="category">${product.category}</p>
            <p class="price">₹${product.price.toLocaleString("en-IN")}</p>
            <button class="add-btn" onclick="addToCart(${product.id})">
              Add to Cart
            </button>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCart();
      alert("Product added to cart!");
    }

    function updateCart() {
      const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      document.getElementById("cartCount").textContent = count;

      const cartItems = document.getElementById("cartItems");
      const cartSection = document.getElementById("cartSection");

      const entries = Object.entries(cart);

      if (entries.length === 0) {
        cartItems.innerHTML = '<p class="empty">Your cart is empty.</p>';
      } else {
        cartItems.innerHTML = entries.map(([id, qty]) => {
          const product = products.find(p => p.id === Number(id));

          return `
            <div class="cart-item">
              <div>
                <strong>${product.name}</strong><br>
                ₹${product.price.toLocaleString("en-IN")} each
              </div>

              <div class="quantity">
                <button onclick="changeQuantity(${id}, -1)">−</button>
                ${qty}
                <button onclick="changeQuantity(${id}, 1)">+</button>
              </div>

              <strong>₹${(product.price * qty).toLocaleString("en-IN")}</strong>

              <button class="remove-btn" onclick="removeItem(${id})">
                Remove
              </button>
            </div>
          `;
        }).join("");
      }

      const total = products.reduce((sum, product) => {
        return sum + product.price * (cart[product.id] || 0);
      }, 0);

      document.getElementById("cartTotal").textContent =
        "Total: ₹" + total.toLocaleString("en-IN");
    }

    function changeQuantity(id, amount) {
      cart[id] = (cart[id] || 0) + amount;

      if (cart[id] <= 0) {
        delete cart[id];
      }

      updateCart();
    }

    function removeItem(id) {
      delete cart[id];
      updateCart();
    }

    function clearCart() {
      cart = {};
      updateCart();
    }

    function showCart() {
      const section = document.getElementById("cartSection");
      section.style.display = "block";
      updateCart();
      section.scrollIntoView({ behavior: "smooth" });
    }

    displayProducts();
    updateCart();
  </script>

</body>
</html>
