<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSmart AI - Smart Shopping</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:Arial,sans-serif;
  background:#f4f6fa;
  color:#202938;
}

header {
  background:#172b4d;
  color:white;
  padding:20px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
}

header h2 { font-size:25px; }

.cart-btn {
  background:#ffad32;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.hero {
  text-align:center;
  padding:55px 15px;
  background:linear-gradient(120deg,#dceaff,#f5eaff);
}

.hero h1 { font-size:35px; margin-bottom:12px; }
.hero p { color:#586477; }

.controls {
  display:flex;
  gap:12px;
  max-width:900px;
  margin:30px auto;
  padding:0 15px;
}

input,select {
  padding:14px;
  border:1px solid #ccd3df;
  border-radius:8px;
  font-size:15px;
  background:white;
}

#search { flex:1; min-width:0; }
#category { width:190px; }

main {
  max-width:1200px;
  margin:auto;
  padding:10px 20px 50px;
}

h2.section-title {
  margin:20px 0;
  text-align:center;
}

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card {
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 14px #00000012;
  transition:.2s;
}

.card:hover { transform:translateY(-5px); }

.card img {
  width:100%;
  height:200px;
  object-fit:cover;
  background:#eee;
}

.card-content { padding:17px; }
.card h3 { margin-bottom:9px; }
.description {
  color:#687386;
  font-size:13px;
  min-height:35px;
  margin-bottom:12px;
}

.price {
  font-size:20px;
  font-weight:bold;
  color:#147a50;
  margin-bottom:13px;
}

.add-btn {
  width:100%;
  padding:12px;
  background:#172b4d;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-size:15px;
}

.add-btn:hover { background:#28518c; }

#empty {
  text-align:center;
  padding:40px;
  color:#687386;
  display:none;
}

.cart-panel {
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:10;
  justify-content:flex-end;
}

.cart-box {
  background:white;
  width:min(430px,100%);
  height:100%;
  overflow-y:auto;
  padding:25px;
}

.cart-heading {
  display:flex;
  justify-content:space-between;
  margin-bottom:25px;
}

.close {
  border:0;
  background:#eee;
  padding:8px 12px;
  border-radius:5px;
  cursor:pointer;
}

.cart-item {
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.cart-item img {
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
}

.cart-info { flex:1; }
.cart-info p { margin-top:6px; }

.quantity {
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:8px;
}

.quantity button {
  padding:4px 10px;
  cursor:pointer;
}

.remove {
  color:#dc3545;
  border:0;
  background:none;
  cursor:pointer;
  margin-top:8px;
}

.total {
  margin-top:25px;
  font-size:22px;
  font-weight:bold;
}

.checkout {
  margin-top:18px;
  width:100%;
  background:#138451;
  color:white;
  padding:14px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

footer {
  background:#172b4d;
  color:white;
  text-align:center;
  padding:25px;
}

@media(max-width:550px) {
  .hero h1 { font-size:26px; }
  .controls { flex-direction:column; }
  #category { width:100%; }
}
</style>
</head>

<body>

<header>
  <h2>🛍️ ShopSmart AI</h2>
  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>Reimagining Shopping with AI</h1>
  <p>Discover products and enjoy a smarter shopping experience!</p>
</section>

<div class="controls">
  <input id="search" type="text"
    placeholder="🔍 Search products..."
    oninput="renderProducts()">

  <select id="category" onchange="renderProducts()">
    <option value="All">All Categories</option>
    <option value="Electronics">Electronics</option>
    <option value="Fashion">Fashion</option>
    <option value="Shoes">Shoes</option>
    <option value="Accessories">Accessories</option>
    <option value="Home">Home</option>
  </select>
</div>

<main>
  <h2 class="section-title">✨ Our Products</h2>
  <div class="products" id="products"></div>
  <div id="empty">No products found. Try another search!</div>
</main>

<div class="cart-panel" id="cartPanel" onclick="closeCart(event)">
  <div class="cart-box" onclick="event.stopPropagation()">
    <div class="cart-heading">
      <h2>🛒 Your Cart</h2>
      <button class="close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>
    <div class="total" id="total">Total: ₹0</div>
    <button class="checkout" onclick="checkout()">
      Proceed to Checkout
    </button>
  </div>
</div>

<footer>
  <p>ShopSmart AI | Smart Shopping Experience</p>
  <p>Hackathon Project © 2026</p>
</footer>

<script>
const products = [
  {
    id:1,name:"Wireless Headphones",category:"Electronics",
    price:1999,description:"Premium sound and comfortable design.",
    image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
  },
  {
    id:2,name:"Smart Watch",category:"Electronics",
    price:2499,description:"Track your fitness and daily activities.",
    image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
  },
  {
    id:3,name:"Running Shoes",category:"Shoes",
    price:1799,description:"Lightweight shoes for everyday comfort.",
    image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
  },
  {
    id:4,name:"Casual T-Shirt",category:"Fashion",
    price:699,description:"Stylish and comfortable everyday wear.",
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
  },
  {
    id:5,name:"Leather Handbag",category:"Fashion",
    price:2299,description:"Elegant handbag for every occasion.",
    image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"
  },
  {
    id:6,name:"Sunglasses",category:"Accessories",
    price:899,description:"Modern sunglasses with stylish frames.",
    image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
  },
  {
    id:7,name:"Digital Camera",category:"Electronics",
    price:15999,description:"Capture beautiful photos and memories.",
    image:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500"
  },
  {
    id:8,name:"Laptop",category:"Electronics",
    price:45999,description:"Powerful laptop for work and study.",
    image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"
  },
  {
    id:9,name:"Backpack",category:"Accessories",
    price:1299,description:"Spacious backpack for travel and college.",
    image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
  },
  {
    id:10,name:"Modern Chair",category:"Home",
    price:3499,description:"Comfortable chair for your home.",
    image:"https://images.unsplash.com/photo-1503602642458-232111445657?w=500"
  },
  {
    id:11,name:"Bluetooth Speaker",category:"Electronics",
    price:1499,description:"Portable speaker with rich sound.",
    image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=500"
  },
  {
    id:12,name:"Classic Watch",category:"Accessories",
    price:1899,description:"Elegant watch for everyday style.",
    image:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=500"
  }
];

// Load saved cart
let cart = JSON.parse(localStorage.getItem("shopCart") || "[]");

function renderProducts() {
  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;

  const filtered = products.filter(p =>
    (p.name.toLowerCase().includes(search) ||
     p.category.toLowerCase().includes(search) ||
     p.description.toLowerCase().includes(search)) &&
    (category === "All" || p.category === category)
  );

  document.getElementById("products").innerHTML =
    filtered.map(p => `
      <div class="card">
        <img src="${p.image}"
          alt="${p.name}"
          onerror="this.src='https://placehold.co/500x300?text=Product'">
        <div class="card-content">
          <h3>${p.name}</h3>
          <p class="description">${p.description}</p>
          <div class="price">₹${p.price.toLocaleString("en-IN")}</div>
          <button class="add-btn" onclick="addToCart(${p.id})">
            Add to Cart 🛒
          </button>
        </div>
      </div>
    `).join("");

  document.getElementById("empty").style.display =
    filtered.length ? "none" : "block";
}

function saveCart() {
  localStorage.setItem("shopCart",JSON.stringify(cart));
  updateCart();
}

function addToCart(id) {
  const item = cart.find(p => p.id === id);

  if(item) {
    item.quantity++;
  } else {
    const product = products.find(p => p.id === id);
    cart.push({...product,quantity:1});
  }

  saveCart();
  alert("Product added to cart!");
}

function updateCart() {
  document.getElementById("cartCount").textContent =
    cart.reduce((sum,p) => sum + p.quantity,0);

  document.getElementById("cartItems").innerHTML =
    cart.length ? cart.map(p => `
      <div class="cart-item">
        <img src="${p.image}" alt="${p.name}">
        <div class="cart-info">
          <strong>${p.name}</strong>
          <p>₹${p.price.toLocaleString("en-IN")}</p>
          <div class="quantity">
            <button onclick="changeQty(${p.id},-1)">−</button>
            <span>${p.quantity}</span>
            <button onclick="changeQty(${p.id},1)">+</button>
          </div>
          <button class="remove" onclick="removeItem(${p.id})">
            Remove
          </button>
        </div>
      </div>
    `).join("") : "<p>Your cart is empty. Start shopping!</p>";

  const total = cart.reduce((sum,p) =>
    sum + p.price * p.quantity,0);

  document.getElementById("total").textContent =
    "Total: ₹" + total.toLocaleString("en-IN");
}

function changeQty(id,amount) {
  const item = cart.find(p => p.id === id);
  if(!item) return;

  item.quantity += amount;

  if(item.quantity <= 0) {
    cart = cart.filter(p => p.id !== id);
  }

  saveCart();
}

function removeItem(id) {
  cart = cart.filter(p => p.id !== id);
  saveCart();
}

function openCart() {
  document.getElementById("cartPanel").style.display = "flex";
  updateCart();
}

function closeCart(event) {
  document.getElementById("cartPanel").style.display = "none";
}

function checkout() {
  if(cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  alert("Your demo cart is ready! Connect a payment gateway to accept real orders.");
}

renderProducts();
updateCart();
</script>

</body>
</html>
